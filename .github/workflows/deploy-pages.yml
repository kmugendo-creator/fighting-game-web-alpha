name: Deploy Web Playable Alpha

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out public alpha payload
        uses: actions/checkout@v6

      - name: Restore deploy-only Web files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -a site/. _site/
          while IFS= read -r -d '' compressed; do
            gzip -dc "$compressed" > "${compressed%.gz}"
            rm "$compressed"
          done < <(find _site -type f -name '*.gz' -print0)
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
